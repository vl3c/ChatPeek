name: CI

on:
  # Only push to the default branch, so a feature branch with an open PR is
  # checked once via pull_request instead of twice (push + pull_request).
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly liveness check so a stale fixture link surfaces on its own.
    # A failed scheduled run notifies the repository owner by email.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege for the default GITHUB_TOKEN: both jobs only read the repo.
# Set at the top level so any job added later starts read-only and has to opt
# into more, rather than silently inheriting the repository default.
permissions:
  contents: read

jobs:
  test:
    # Offline unit tests: replay saved fixtures, no network.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m mypy .
      - run: python -m unittest ChatPeek_test -v

  check-links:
    # Network liveness check for the share links behind the fixtures.
    # Runs on the weekly schedule and on manual dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python check_fixture_links.py
