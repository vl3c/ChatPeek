name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly liveness check so a stale fixture link surfaces on its own.
    # A failed scheduled run notifies the repository owner by email.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    # Offline unit tests: replay saved fixtures, no network.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m mypy .
      - run: python -m unittest ChatPeek_test -v

  check-links:
    # Network liveness check for the share links behind the fixtures.
    # Runs on the weekly schedule and on manual dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python check_fixture_links.py
